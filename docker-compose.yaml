services:
    mahook-web:
        image: mahook-web:latest
        restart: always
        expose:
            - 3000
        ports:
            - "3003:3000"
        container_name: mahook-web
        environment:
            TZ: Asia/Seoul
            NODE_ENV: ${NODE_ENV}
            TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN}
            TWITTER_CT0: ${TWITTER_CT0}
            DEBUG_WEBHOOK_URL: ${DEBUG_WEBHOOK_URL}
            GEMINI_API_KEY: ${GEMINI_API_KEY}
            DEEPL_API_KEY: ${DEEPL_API_KEY}
            DEEPL_GLOSSARY_ID: ${DEEPL_GLOSSARY_ID}
            NOTICE_TOKEN_KEY: ${NOTICE_TOKEN_KEY}
            DB_HOST: ${DB_HOST}
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            LINE_SIGNING_PUBLIC_KEY: ${LINE_SIGNING_PUBLIC_KEY}
            LINE_SIGNING_KEY_ID: ${LINE_SIGNING_KEY_ID:-line-2026-01}
        networks:
            - mahook
        depends_on:
            mahook-db:
                condition: service_healthy

    mahook-db:
        image: mahook-db:latest
        container_name: mahook-db
        restart: always
        volumes:
            - /mahook-db:/var/lib/mysql
        environment:
            TZ: Asia/Seoul
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        networks:
            - mahook

networks:
    mahook:
