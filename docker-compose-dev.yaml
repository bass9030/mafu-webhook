services:
    mahook-web:
        build:
            context: .
            target: development
        develop:
            watch:
                - action: sync+restart
                  path: ./app.ts
                  target: /usr/src/app/app.ts
                - action: sync+restart
                  path: ./bin/
                  target: /usr/src/app/bin
                - action: sync+restart
                  path: ./client/
                  target: /usr/src/app/client
                - action: sync+restart
                  path: ./utils/
                  target: /usr/src/app/utils
                - action: sync+restart
                  path: ./routes/
                  target: /usr/src/app/routes
                - action: sync
                  path: ./views/
                  target: /usr/src/app/views
                - action: sync
                  path: ./public/
                  target: /usr/src/app/public
        ports:
            - "3000:3000"
        container_name: mahook-web
        environment:
            TZ: Asia/Seoul
            NODE_ENV: development
            TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN}
            TWITTER_CT0: ${TWITTER_CT0}
            DEBUG_WEBHOOK_URL: ${DEBUG_WEBHOOK_URL}
            GEMINI_API_KEY: ${GEMINI_API_KEY}
            DEEPL_API_KEY: ${DEEPL_API_KEY}
            DEEPL_GLOSSARY_ID: ${DEEPL_GLOSSARY_ID}
            NOTICE_TOKEN_KEY: ${NOTICE_TOKEN_KEY}
            DB_HOST: ${DB_HOST}
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            LINE_SIGNING_PUBLIC_KEY: ${LINE_SIGNING_PUBLIC_KEY}
            LINE_SIGNING_KEY_ID: ${LINE_SIGNING_KEY_ID:-line-2026-01}
        networks:
            - mahook
        depends_on:
            mahook-db:
                condition: service_healthy

    mahook-db:
        build:
            context: .
            dockerfile: ./dockerfile.mariadb
        container_name: mahook-db
        volumes:
            - ./mahook-db:/var/lib/mysql
        environment:
            TZ: Asia/Seoul
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        networks:
            - mahook

networks:
    mahook:
